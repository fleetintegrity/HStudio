<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>HStudio Staff</title><link rel="stylesheet" href="style.css?v=20260916-1738"><link rel="stylesheet" href="admin-v2.css?v=20260916-1738"><link rel="stylesheet" href="admin-extras.css?v=20260916-1738"><link rel="stylesheet" href="admin-completed.css?v=20260916-1738"></head><body><div class="admin-layout"><aside class="sidebar"><div class="admin-brand"><img src="assets/logo.jpeg"><div><b>HSTUDIO</b><small>STAFF</small></div></div><div id="staffIdentity" class="staff-identity"></div><nav><button class="active" data-view="dashboard" data-owner-only>Dashboard</button><button data-view="diary">Diary</button><button data-view="bookings">All bookings</button><button data-view="customers">Customers</button><button data-view="reviews" data-owner-only>Reviews</button><button data-view="reports" data-owner-only>Reports</button><button data-view="hours">Working hours</button><button data-view="timeoff">Book Holiday</button><button data-view="services" data-owner-only>Services</button><button data-view="staff" data-owner-only>Barbers</button><button data-view="settings" data-owner-only>Settings</button></nav><button class="signout-btn" onclick="signOut()">Sign out</button></aside><main class="admin-main"><div id="admin"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=20260916-1738"></script><script src="app.js?v=20260916-1738"></script><script src="admin-v2.js?v=20260916-1738"></script><script src="admin-completed.js?v=20260916-1738"></script><script src="admin-cancel.js?v=20260916-1738"></script><script src="admin-customer.js?v=20260916-1738"></script><script src="admin-names.js?v=20260916-1738"></script><script src="accountant-reports.js?v=20260916-1738"></script><script src="admin-staff.js?v=20260916-1738"></script><script>
async function inlineCustomers(){const el=document.querySelector('#admin');el.innerHTML='<div class="admin-hero"><div><span class="eyebrow">Customers</span><h1>Customer lookup</h1><p>Search booking history, spend and visit information.</p></div></div><section class="dash-section"><div class="customer-search"><input id="customerSearch" placeholder="Search name, mobile or email"><button class="btn" id="customerGo">Search</button></div><div id="customerResults"><p>Loading customers…</p></div></section>';const run=async()=>{const q=document.querySelector('#customerSearch').value.trim(),out=document.querySelector('#customerResults');const{data,error}=await sb.rpc('staff_customer_lookup',{p_search:q||null});if(error){out.innerHTML='<p class="error">'+esc(error.message)+'</p>';return}out.innerHTML=(data||[]).length?'<div class="customer-list">'+data.map(c=>'<article class="customer-card"><h3>'+esc(c.full_name||'Customer')+'</h3><p>'+esc(c.phone||'')+(c.email?' · '+esc(c.email):'')+'</p><div class="customer-stats"><span><b>'+c.total_bookings+'</b> bookings</span><span><b>'+c.completed_bookings+'</b> completed</span><span><b>'+money(c.total_spent_pence||0)+'</b> spent</span><span><b>'+c.no_shows+'</b> no-shows</span></div><p><b>Usually:</b> '+esc(c.favourite_service||'—')+' · '+esc(c.favourite_barber||'—')+'</p></article>').join('')+'</div>':'<div class="empty-state"><b>No customers found</b><span>Try another name, phone number or email.</span></div>'};document.querySelector('#customerGo').onclick=run;document.querySelector('#customerSearch').onkeydown=e=>{if(e.key==='Enter')run()};await run()}
async function inlineReviews(){const el=document.querySelector('#admin');el.innerHTML='<div class="admin-hero"><div><span class="eyebrow">Reputation</span><h1>Reviews</h1><p>Add and manage customer reviews.</p></div></div><section class="dash-section"><div id="reviewBody"><p>Loading reviews…</p></div></section>';const{data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false});const body=document.querySelector('#reviewBody');if(error){body.innerHTML='<p class="error">'+esc(error.message)+'</p>';return}body.innerHTML='<form id="reviewForm" class="formgrid"><label class="field">Customer name<input name="name" required></label><label class="field">Rating<select name="rating"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select></label><label class="field full">Review<textarea name="text" required></textarea></label><label class="field full"><input type="checkbox" name="approved" checked> Publish on website</label><button class="btn field full">Add review</button></form><div class="review-admin-list" style="margin-top:20px">'+((data||[]).map(r=>'<article class="customer-card"><h3>'+('★'.repeat(r.rating))+' <small>'+esc(r.customer_name)+'</small></h3><p>'+esc(r.review_text||'')+'</p><p><b>'+(r.approved?'Published':'Hidden')+'</b></p></article>').join('')||'<div class="empty-state"><b>No reviews yet</b></div>')+'</div>';document.querySelector('#reviewForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),{error}=await sb.from('reviews').insert({customer_name:f.get('name'),rating:Number(f.get('rating')),review_text:f.get('text'),approved:f.get('approved')==='on'});if(error)return alert(error.message);await inlineReviews()}}
(async()=>{const me=await requireStaff();if(!me)return;window.__hstudioMe=me;const owner=me.role==='owner'||me.role==='admin',identity=document.querySelector('#staffIdentity');identity.innerHTML=`<span>${owner?'Owner':'Barber'}</span><b>${esc(me.barbers?.name||'Staff')}</b><small>${owner?'Full shop access':'Your diary & availability'}</small>`;if(!owner){document.querySelectorAll('[data-owner-only]').forEach(x=>x.remove());const b=document.querySelector('[data-view="bookings"]');if(b)b.textContent='My bookings';const h=document.querySelector('[data-view="hours"]');if(h)h.textContent='My hours';document.querySelector('[data-view="diary"]')?.classList.add('active')}document.querySelectorAll('.sidebar button[data-view]').forEach(b=>{b.onclick=async e=>{e.preventDefault();e.stopPropagation();document.querySelectorAll('.sidebar button[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const view=b.dataset.view;if(view==='customers'){await inlineCustomers();return}if(view==='reviews'){await inlineReviews();return}await adminView(view,me)}});await adminView(owner?'dashboard':'diary',me)})();
</script></body></html>
