<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>HStudio Staff</title><link rel="stylesheet" href="style.css"></head><body><div class="admin-layout"><aside class="sidebar"><div class="admin-brand"><img src="assets/logo.jpeg"><div><b>HSTUDIO</b><small>STAFF</small></div></div><div id="staffIdentity" class="staff-identity"></div><nav><button class="active" data-view="diary">Diary</button><button data-view="bookings">All bookings</button><button data-view="timeoff">Block time</button><button data-view="services" data-owner-only>Services</button><button data-view="staff" data-owner-only>Barbers</button><button data-view="settings" data-owner-only>Settings</button></nav><button class="signout-btn" onclick="signOut()">Sign out</button></aside><main class="admin-main"><div id="admin"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="admin-v2.js"></script><script>
(async()=>{
 const me=await requireStaff();if(!me)return;
 const owner=me.role==='owner'||me.role==='admin';
 const identity=document.querySelector('#staffIdentity');identity.innerHTML=`<span>${owner?'Owner':'Barber'}</span><b>${esc(me.barbers?.name||'Staff')}</b><small>${owner?'Full shop access':'Your diary & availability'}</small>`;
 if(!owner){document.querySelectorAll('[data-owner-only]').forEach(x=>x.remove());const t=document.querySelector('[data-view="timeoff"]');if(t)t.textContent='My time off';const b=document.querySelector('[data-view="bookings"]');if(b)b.textContent='My bookings';}
 document.querySelectorAll('.sidebar button[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sidebar button[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');adminView(b.dataset.view,me);if(!owner&&b.dataset.view==='timeoff')setTimeout(()=>{const form=document.querySelector('#blockform'),sel=form?.querySelector('select[name="barber"]');if(sel&&me.barber_id){sel.innerHTML=`<option value="${me.barber_id}">${esc(me.barbers?.name||'Me')}</option>`;sel.value=me.barber_id;sel.disabled=true;const h=document.createElement('input');h.type='hidden';h.name='barber';h.value=me.barber_id;sel.after(h)}},50)});
 adminView('diary',me);
})();
</script></body></html>
