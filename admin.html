<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><title>HStudio Staff</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin-v2.css"><link rel="stylesheet" href="admin-extras.css"></head><body><div class="admin-layout"><aside class="sidebar"><div class="admin-brand"><img src="assets/logo.jpeg"><div><b>HSTUDIO</b><small>STAFF</small></div></div><div id="staffIdentity" class="staff-identity"></div><nav><button class="active" data-view="dashboard" data-owner-only>Dashboard</button><button data-view="diary">Diary</button><button data-view="bookings">All bookings</button><button data-view="customers">Customers</button><button data-view="reviews" data-owner-only>Reviews</button><button data-view="reports" data-owner-only>Reports</button><button data-view="hours">Working hours</button><button data-view="timeoff">Book Holiday</button><button data-view="services" data-owner-only>Services</button><button data-view="staff" data-owner-only>Barbers</button><button data-view="settings" data-owner-only>Settings</button></nav><button class="signout-btn" onclick="signOut()">Sign out</button></aside><main class="admin-main"><div id="admin"></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script><script src="admin-v2.js"></script><script src="admin-cancel.js"></script><script src="admin-customer.js"></script><script src="admin-extras.js"></script><script src="admin-names.js"></script><script>(async()=>{const me=await requireStaff();if(!me)return;window.__hstudioMe=me;const owner=me.role==='owner'||me.role==='admin',identity=document.querySelector('#staffIdentity');identity.innerHTML=`<span>${owner?'Owner':'Barber'}</span><b>${esc(me.barbers?.name||'Staff')}</b><small>${owner?'Full shop access':'Your diary & availability'}</small>`;if(!owner){document.querySelectorAll('[data-owner-only]').forEach(x=>x.remove());const t=document.querySelector('[data-view="timeoff"]');if(t)t.textContent='Book Holiday';const b=document.querySelector('[data-view="bookings"]');if(b)b.textContent='My bookings';const h=document.querySelector('[data-view="hours"]');if(h)h.textContent='My hours';document.querySelector('[data-view="diary"]')?.classList.add('active')}document.querySelectorAll('.sidebar button[data-view]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('.sidebar button[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const handled=await window.hstudioExtraView?.(b.dataset.view,me);if(!handled)adminView(b.dataset.view,me);if(!owner&&b.dataset.view==='timeoff')setTimeout(()=>{const form=document.querySelector('#blockform'),sel=form?.querySelector('select[name="barber"]');if(sel&&me.barber_id){sel.innerHTML=`<option value="${me.barber_id}">${esc(me.barbers?.name||'Me')}</option>`;sel.value=me.barber_id;sel.disabled=true;const h=document.createElement('input');h.type='hidden';h.name='barber';h.value=me.barber_id;sel.after(h)}},50)});adminView(owner?'dashboard':'diary',me)})();</script><!-- cloudflare git connection test 2026-09-16 16:45 BST --></body></html>
